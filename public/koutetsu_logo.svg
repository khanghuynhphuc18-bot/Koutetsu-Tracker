    <rect x="250" y="48" width="12" height="46" fill="#FFFFFF" stroke="#0f172a" stroke-width="1.8"/>
    <polygon points="256,34 263,42 256,48 249,42" fill="#FFFFFF" stroke="#0f172a" stroke-width="1.8"/>
